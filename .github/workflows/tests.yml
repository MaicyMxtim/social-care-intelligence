name: Tests

# Runs on every push and pull request, and once a week so that a change in a
# dependency is caught even when nobody has touched the code.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  pytest:
    name: Run the test suite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The published files are large and the tests that need them are skipped
      # when they are absent, so the cache is a convenience rather than a
      # requirement. A cache miss means the loader tests skip and the statistical
      # tests still run.
      - name: Restore cached source data
        id: cache-raw
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-data-${{ hashFiles('scripts/download.py') }}

      - name: Download the source data
        if: steps.cache-raw.outputs.cache-hit != 'true'
        continue-on-error: true
        run: python scripts/download.py

      - name: Run pytest
        run: python -m pytest tests/ -v
